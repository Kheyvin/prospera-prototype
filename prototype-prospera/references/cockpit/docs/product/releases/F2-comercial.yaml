  - negocio-yaml-proyeccion-generada
  - conectores-ingesta-por-sistema
exit_criteria: >-
  Un cliente nuevo entra solo por el Portal: paga, obtiene su instancia hosteada, descarga sus
  apps con licencias por asiento activadas por fingerprint, y su lakehouse ingiere ≥1 sistema
  vía el catálogo de conectores. UI migrada a Vite + design system aplicado.
