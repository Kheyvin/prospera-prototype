id: F1
nombre: "Terreno + MVP Twin vendible"
estado: en-curso
descripcion: >-
  El MVP del Organization Twin (CK-21/CK-22 · re-secuenciada twin-first CK-23): primero el twin
  LLENO y pintado — organización ficticia completa (golden fixture) contra el schema v2 + vistas
  hilo de oro y brecha→proyecto en Cockpit, con KPIs hardcodeados del fixture —, después el
  proceso que lo llena (Consultio v0 = arneses del método sin app shell), después la organización
  viva (instancia single-tenant con entornos dev→UAT→prod y Gestión de Cambios), y al final el
  lakehouse real que reemplaza los valores hardcodeados. Cinco fases + un carril de negocio
  paralelo; la Fase 0 (terreno: re-fichado de la arquitectura + schema v2) precede a todo lo
  funcional por decisión del operador. Hito intermedio (CK-23): twin completo demo-able con la
  organización ficticia al cierre de F1.1. Vista humana y criterios de salida:
  docs/product/ROADMAP.md.
