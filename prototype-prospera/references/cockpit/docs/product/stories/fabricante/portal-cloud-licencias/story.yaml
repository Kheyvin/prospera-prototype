  titulo: "Portal cloud del Fabricante — login, cobro, asientos, descargas, licencias node-locked (N3 producto)"
  detalle: >-
    NUEVO CK-21 (D4). N3 crece a producto: portal cloud con login, cobro, gestión de
    usuarios/asientos, descargas (apps + arneses) y licencias por asiento con fingerprint compuesto
    (NO MAC: spoofeable/inestable; SOTA = CPU+disco+placa hasheado SHA-256, node-locked,
    activación/desactivación, heartbeat — keygen-go ya en la ficha N3). Extiende el plano N3 de
    BL-25 (distribución + telemetría + licencias offline). Research: organization-as-code/08.
  origen: "ficha CK-21 (2026-07-16) — visión organization-as-code + organization twin"
