context:
  job: "Como equipo de Cockpit quiero UN mockup/prototipo interactivo con datos hardcodeados que muestre el ESTADO FINAL COMPLETO de la solución (territorio/twin + Mejora + Método + Cambios, zoom semántico, capas, las 20 entidades), para tener el contrato visual ratificado ANTES de construir la app real (decisión 10, 2026-07-24 — creció desde 'solo el mapa del twin')."
  why: "Hoy el twin son 4 tabs planas (Mapa/Hilo/Brechas/Personas) — fragmentado, y el resto del producto (Mejora/Método/Cambios) no tiene vista de referencia. Sin una maqueta de inicio-a-fin ratificada, construir es adivinar el estado final pieza por pieza. Es el diferenciador visual del producto (Organization as Code → Organization Twin, CK-21) Y el plano de construcción."
provenance:
  backlog_id: null
  titulo: "Mockup del estado final de Cockpit — territorio+Mejora+Método+Cambios, datos canned, contrato visual pre-construcción (creció desde 'twin como territorio')"
  detalle: >-
    Concepto de sesión 2026-07-20 (post CK-27, design system PRENTER adoptado). Re-concibe la
    superficie /negocio: de 4 tabs planas a UN mapa (organigrama conectado) con zoom semántico
    (organización → área → proceso-lienzo → detalle) y capas conmutables que se pintan encima
    (estructura/hilo-de-oro/salud/brechas/cinética). Inspiración de canvas: ~/Proyectos/harness-studio
    (repo hermano — su "Organigrama" specado-no-construido = React Flow; su map-canvas swim-lane =
    HTML+SVG a mano). Mockup interactivo publicado y ya iterado con el operador (fixes visuales:
    dark-only robusto, organigrama completo 13 nodos, sin relleno plomo). PENDIENTE: el operador
    tiene MÁS ajustes visuales que dará en una conversación nueva.
  origen: "operador, sesión 2026-07-20"
  estado_legacy: nuevo
