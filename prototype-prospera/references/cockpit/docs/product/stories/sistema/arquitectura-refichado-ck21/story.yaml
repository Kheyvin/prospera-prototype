  titulo: "Re-fichado fino de la arquitectura post-CK-21 (preparar el terreno)"
  detalle: >-
    NUEVO CK-22 (deuda declarada en CK-21). Alcance: (1) NODOS.md pase fino — chequeo 2 en
    profundidad (residencia por tier), R-walk si el Portal (N3) agrega responsabilidad propia,
    coherencia de todas las fichas con el default hosteado single-tenant; (2) despliegue.html
    curado — N3 como Portal, las dos modalidades de la Organización (hosteada/self-hosted), el
    twin como narrativa del flujo; (3) arquitectura.yaml — componentes nuevos declarados
    (motor-de-indicadores, ciclo brecha→proyecto, portal) con `fichas:` y `ruta:` válidas según
    el gate; (4) gates verdes en el mismo evento. Research: organization-as-code/07 §Derivación
    de arquitectura + 08 (pivote comercial).
