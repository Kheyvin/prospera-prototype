  job: "Como arquitecto del sistema quiero bajar CK-21 completo a la arquitectura-as-code (NODOS fino, despliegue.html curado, arquitectura.yaml, R-walk) para que todo lo funcional del MVP se construya sobre un mapa sin contradicciones con el norte organization-as-code → organization twin."
  why: "Es la primera historia del roadmap por decisión del operador (CK-22): preparar el terreno antes de lo funcional. CK-21 ajustó las fichas esenciales pero declaró como deuda el pase fino — sin él, las historias del MVP anclan a nodos con residuos del modelo anterior."
