<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="880" viewBox="0 0 1760 880" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <!-- MAQUETA COMERCIAL Prenter — sección 05 Visibilidad Total: "De sus documentos a su tablero".
       Datos/rótulos en lenguaje de directorio. Dark Prenter, teal #00b7aa. -->
  <defs>
    <marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a565a"/>
    </marker>
    <marker id="ar-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00b7aa"/>
    </marker>
    <marker id="ar-td" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0c6f68"/>
    </marker>
  </defs>

  <!-- fondo -->
  <rect width="1760" height="880" fill="#0a0c0d"/>

  <!-- header -->
  <text x="70" y="80" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#5e6b6f">VISIBILIDAD TOTAL · FASE 1 — DIAGNÓSTICO DIGITAL</text>
  <text x="70" y="124" font-size="34" font-weight="700" fill="#e7edee">De sus documentos a su tablero</text>
  <text x="70" y="156" font-size="15" fill="#8a989c">Observamos cómo opera su empresa de verdad — y lo dejamos visible, navegable y al día.</text>

  <!-- etiquetas de etapa -->
  <text x="245" y="222" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#5e6b6f">LO QUE YA TIENE</text>
  <text x="740" y="222" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#5e6b6f">LO QUE INSTALAMOS EN SU RED</text>
  <text x="1210" y="222" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#00b7aa">EL MAPA VIVO</text>
  <text x="1585" y="222" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#5e6b6f">QUIÉN LO VE</text>

  <!-- ══ Columna A · lo que ya tiene ══ -->
  <g>
    <rect x="70" y="250" width="350" height="125" rx="14" fill="#14191b" stroke="#232b2e"/>
    <g transform="translate(96,282)" stroke="#8a989c" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="18" height="23" rx="2.5"/>
      <line x1="4" y1="7" x2="14" y2="7"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="17" x2="10" y2="17"/>
    </g>
    <text x="134" y="292" font-size="17" font-weight="600" fill="#e7edee">Documentación técnica</text>
    <text x="134" y="318" font-size="12.5" fill="#8a989c">Manuales, organigramas, contratos,</text>
    <text x="134" y="338" font-size="12.5" fill="#8a989c">procedimientos.</text>
  </g>
  <g>
    <rect x="70" y="403" width="350" height="125" rx="14" fill="#14191b" stroke="#232b2e"/>
    <g transform="translate(96,436)" stroke="#8a989c" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="22" height="16" rx="5"/>
      <path d="M6 16 L6 22 L12 16"/>
      <circle cx="6.5" cy="8" r="1" fill="#8a989c" stroke="none"/><circle cx="11" cy="8" r="1" fill="#8a989c" stroke="none"/><circle cx="15.5" cy="8" r="1" fill="#8a989c" stroke="none"/>
    </g>
    <text x="134" y="445" font-size="17" font-weight="600" fill="#e7edee">Entrevistas guiadas por IA</text>
    <text x="134" y="471" font-size="12.5" fill="#8a989c">Detectan el drift: lo que está escrito</text>
    <text x="134" y="491" font-size="12.5" fill="#8a989c">vs. lo que de verdad se hace.</text>
  </g>
  <g>
    <rect x="70" y="556" width="350" height="125" rx="14" fill="#14191b" stroke="#232b2e"/>
    <g transform="translate(96,589)" stroke="#8a989c" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="9" height="9" rx="2"/><rect x="13" y="0" width="9" height="9" rx="2"/>
      <rect x="0" y="13" width="9" height="9" rx="2"/><rect x="13" y="13" width="9" height="9" rx="2"/>
    </g>
    <text x="134" y="598" font-size="17" font-weight="600" fill="#e7edee">Sus sistemas actuales</text>
    <text x="134" y="624" font-size="12.5" fill="#8a989c">ERP, facturación, Excel, WhatsApp,</text>
    <text x="134" y="644" font-size="12.5" fill="#8a989c">correo — tal como están.</text>
  </g>

  <!-- flechas A → B -->
  <path d="M424 312 C 490 312, 495 330, 552 336" fill="none" stroke="#4a565a" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <path d="M424 465 C 490 465, 495 395, 552 372" fill="none" stroke="#4a565a" stroke-width="1.5" marker-end="url(#ar-g)"/>
  <path d="M424 618 C 490 618, 495 590, 552 584" fill="none" stroke="#4a565a" stroke-width="1.5" marker-end="url(#ar-g)"/>

  <!-- ══ Columna B · lo instalado ══ -->
  <g>
    <rect x="560" y="250" width="360" height="185" rx="14" fill="#14191b" stroke="#232b2e"/>
    <g transform="translate(586,282)" stroke="#8a989c" stroke-width="1.8" fill="none">
      <circle cx="4" cy="3" r="3.5"/><circle cx="4" cy="21" r="3.5"/><circle cx="19" cy="12" r="3.5"/>
      <path d="M4 6.5 L4 17.5 M6.5 5 C 14 7, 14 17, 6.5 19"/>
    </g>
    <text x="624" y="292" font-size="17" font-weight="600" fill="#e7edee">Repositorio Oficial</text>
    <text x="624" y="318" font-size="12.5" fill="#8a989c">La estructura: procesos, roles,</text>
    <text x="624" y="338" font-size="12.5" fill="#8a989c">objetivos y metas de su organización.</text>
    <text x="624" y="358" font-size="12.5" fill="#8a989c">Con historial de cambios, confidencial.</text>
    <text x="586" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5e6b6f">CÓMO DEBERÍA OPERAR</text>
  </g>
  <g>
    <rect x="560" y="490" width="360" height="185" rx="14" fill="#14191b" stroke="#232b2e"/>
    <g transform="translate(586,520)" stroke="#8a989c" stroke-width="1.8" fill="none">
      <ellipse cx="11" cy="4" rx="11" ry="4"/>
      <path d="M0 4 L0 20 C 0 22.2, 4.9 24, 11 24 C 17.1 24, 22 22.2, 22 20 L22 4"/>
      <path d="M0 12 C 0 14.2, 4.9 16, 11 16 C 17.1 16, 22 14.2, 22 12"/>
    </g>
    <text x="624" y="532" font-size="17" font-weight="600" fill="#e7edee">Data Lakehouse</text>
    <text x="624" y="558" font-size="12.5" fill="#8a989c">La operación: los datos del día a día</text>
    <text x="624" y="578" font-size="12.5" fill="#8a989c">de todos sus sistemas, reunidos</text>
    <text x="624" y="598" font-size="12.5" fill="#8a989c">en un solo lugar.</text>
    <text x="586" y="644" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5e6b6f">CÓMO OPERA DE VERDAD</text>
  </g>

  <!-- flechas B → C (teal) -->
  <path d="M924 342 C 990 342, 990 415, 1042 428" fill="none" stroke="#00b7aa" stroke-width="2" marker-end="url(#ar-t)"/>
  <path d="M924 582 C 990 582, 990 515, 1042 502" fill="none" stroke="#00b7aa" stroke-width="2" marker-end="url(#ar-t)"/>

  <!-- ══ Columna C · Cockpit ══ -->
  <g>
    <rect x="1044" y="324" width="332" height="282" rx="18" fill="none" stroke="#00b7aa" stroke-opacity=".22" stroke-width="7"/>
    <rect x="1050" y="330" width="320" height="270" rx="14" fill="#101b1a" stroke="#00b7aa" stroke-width="1.5"/>
    <g transform="translate(1078,362)" stroke="#00b7aa" stroke-width="2" fill="none">
      <path d="M0 18 A 15 15 0 1 1 30 18"/>
      <line x1="15" y1="18" x2="23" y2="8"/>
      <circle cx="15" cy="18" r="2.4" fill="#00b7aa" stroke="none"/>
    </g>
    <text x="1124" y="382" font-size="22" font-weight="700" fill="#e7edee">Cockpit</text>
    <text x="1078" y="420" font-size="13" fill="#c9d4d6">Cruza la estructura con la operación</text>
    <text x="1078" y="440" font-size="13" fill="#c9d4d6">real, alineada a sus objetivos:</text>
    <text x="1078" y="472" font-size="13" fill="#8a989c">·  cumplimiento en tiempo real</text>
    <text x="1078" y="496" font-size="13" fill="#8a989c">·  desviaciones anticipadas</text>
    <text x="1078" y="520" font-size="13" fill="#8a989c">·  OKRs bajados hasta el último nivel</text>
    <text x="1078" y="544" font-size="13" fill="#8a989c">·  el dato para decidir qué automatizar</text>
    <text x="1078" y="580" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#00b7aa">SIEMPRE AL DÍA</text>
  </g>

  <!-- flechas C → D -->
  <path d="M1380 430 C 1430 420, 1430 350, 1462 337" fill="none" stroke="#0c6f68" stroke-width="1.5" marker-end="url(#ar-td)"/>
  <path d="M1380 468 C 1425 470, 1430 474, 1462 475" fill="none" stroke="#0c6f68" stroke-width="1.5" marker-end="url(#ar-td)"/>
  <path d="M1380 506 C 1430 520, 1430 600, 1462 613" fill="none" stroke="#0c6f68" stroke-width="1.5" marker-end="url(#ar-td)"/>

  <!-- ══ Columna D · niveles de acceso ══ -->
  <g>
    <rect x="1470" y="280" width="230" height="110" rx="14" fill="#14191b" stroke="#232b2e"/>
    <g transform="translate(1494,312)" stroke="#8a989c" stroke-width="1.8" fill="none">
      <circle cx="9" cy="5" r="4.5"/><path d="M0 22 C 0 14, 18 14, 18 22"/>
    </g>
    <text x="1530" y="322" font-size="16" font-weight="600" fill="#e7edee">Directorio</text>
    <text x="1530" y="346" font-size="12" fill="#8a989c">la foto completa</text>
  </g>
  <g>
    <rect x="1470" y="420" width="230" height="110" rx="14" fill="#14191b" stroke="#232b2e"/>
    <g transform="translate(1494,452)" stroke="#8a989c" stroke-width="1.8" fill="none">
      <circle cx="9" cy="5" r="4.5"/><path d="M0 22 C 0 14, 18 14, 18 22"/>
    </g>
    <text x="1530" y="462" font-size="16" font-weight="600" fill="#e7edee">C-level y Gerencias</text>
    <text x="1530" y="486" font-size="12" fill="#8a989c">sus objetivos y áreas</text>
  </g>
  <g>
    <rect x="1470" y="560" width="230" height="110" rx="14" fill="#14191b" stroke="#232b2e"/>
    <g transform="translate(1494,592)" stroke="#8a989c" stroke-width="1.8" fill="none">
      <circle cx="9" cy="5" r="4.5"/><path d="M0 22 C 0 14, 18 14, 18 22"/>
    </g>
    <text x="1530" y="602" font-size="16" font-weight="600" fill="#e7edee">Jefaturas</text>
    <text x="1530" y="626" font-size="12" fill="#8a989c">sus procesos y equipos</text>
  </g>
  <text x="1585" y="704" text-anchor="middle" font-size="12" font-style="italic" fill="#5e6b6f">Cada nivel ve exactamente</text>
  <text x="1585" y="722" text-anchor="middle" font-size="12" font-style="italic" fill="#5e6b6f">su rebanada.</text>

  <!-- footer -->
  <line x1="70" y1="780" x2="1690" y2="780" stroke="#232b2e"/>
  <g transform="translate(70,802)" stroke="#00b7aa" stroke-width="1.8" fill="none">
    <rect x="0" y="7" width="16" height="12" rx="2.5"/>
    <path d="M3.5 7 L3.5 4.5 A 4.5 4.5 0 0 1 12.5 4.5 L12.5 7"/>
  </g>
  <text x="100" y="818" font-size="13.5" fill="#8a989c">Se instala <tspan fill="#e7edee" font-weight="600">en su infraestructura</tspan> — su información nunca sale de su red.</text>
  <text x="1690" y="818" text-anchor="end" font-size="13" fill="#5e6b6f"><tspan fill="#00b7aa" font-weight="700">Prenter</tspan> · Tecnología Global, Inteligencia Local.</text>
</svg>
