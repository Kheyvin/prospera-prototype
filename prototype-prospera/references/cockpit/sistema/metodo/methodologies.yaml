    - { m: M04, como: "el tope de la apuesta (appetite Shape Up) consume bolsa: sellar una apuesta sin bolsa disponible es una decisión, no un trámite" }
    - { m: M22, como: "el caso de valor de cada brecha se paga contra una bolsa; el retorno prometido se coteja contra lo efectivamente comprometido" }
    - { m: M58, como: "el presupuesto se APRUEBA en la sesión de directorio y las facultades por monto dicen qué gasto vuelve a subir a ese nivel" }
    - { m: M55, como: "la ejecución real del presupuesto se cierra contra el gasto del reporte financiero, no contra una planilla paralela" }
    - { m: M61, como: "división cardinal: M57 guarda el reparto y su compromiso; OBZ es CÓMO se arma (desde cero, por paquete con dueño) en vez de heredarlo. Un solo presupuesto en el twin — OBZ es método de construcción, no una segunda bolsa" }
