  nombre_corto: "Presupuesto (asignado vs comprometido)"
  familia: F
  fuente: { autor: "Práctica de planeamiento y control de gestión (budgeting & control) · CIMA/IMA management accounting", obra: "Presupuesto anual, compromiso y ejecución; análisis de variación contra plan", url: "https://www.cimaglobal.com/Research--Insight/Budgeting-and-forecasting/" }
  que: "el reparto anual del dinero en bolsas, el seguimiento de lo COMPROMETIDO contra lo ASIGNADO, y la variación contra plan como lente primaria de la revisión (no el valor absoluto)"
  aporte_unico: "vuelve EXIGIBLE la mezcla de ambición: 70/20/10 en porcentaje es una intención; con presupuesto por bolsa es una decisión con firma y con saldo. Y separa asignado de comprometido — el futuro se compra cuando el dinero se compromete, no cuando se declara la intención"
  cuando_usar: "encuadre anual del directorio (m1) y su seguimiento en cada sesión (m2); al aprobar cualquier apuesta o proyecto que consuma bolsa"
  objeto_primario: O2
