M12:
  nombre: "APQC Process Classification Framework (PCF)"
  familia: B
  fuente: { autor: "APQC", obra: "Process Classification Framework", url: "https://www.apqc.org/process-frameworks" }
  que: "taxonomía universal de procesos (12 categorías, ~1000 procesos), open standard"
