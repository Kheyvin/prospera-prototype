M52:
  nombre: "ISO 31000:2018 — apetito de riesgo (con COSO ERM como marco alterno)"
  nombre_corto: "ISO 31000 (apetito)"
  familia: D
  fuente: { autor: "ISO/TC 262 · COSO", obra: "ISO 31000:2018 — Risk management: guidelines (criterios de riesgo) · COSO ERM 2017 (risk appetite statement formal, alineado a estrategia)", url: "https://www.iso.org/iso-31000-risk-management.html" }
  que: "gestión de riesgos (principios + marco + proceso): la gobernanza fija CRITERIOS de riesgo — cuánto y qué tipo de riesgo se acepta por categoría (el APETITO); y el proceso (identificar → analizar → evaluar → tratar → seguir) produce el REGISTRO: cada riesgo con probabilidad, impacto, responsable, mitigación comprometida y tendencia. COSO ERM aporta la declaración formal de apetito cuando el cliente la exige"
  aporte_unico: "las DOS mitades, que sólo sirven juntas: el APETITO como dato del directorio (la vara contra la que se gradúa cada apuesta/objetivo — el panel 'riesgo vs apetito' deja de ser cualitativo suelto) y el REGISTRO como su contraparte (sin registro, el apetito es una declaración sin nada que medir; sin apetito, el registro es una lista sin veredicto). El nivel se DERIVA de probabilidad × impacto y el veredicto —dentro / al límite / por encima del apetito— se deriva contra la vara de SU categoría: ninguno de los dos se declara a mano. Primera ancla de O1 en el twin"
  cuando_usar: "encuadre del nivel directorio (m1) y cada sesión de revisión (m2): el directorio fija el apetito por categoría (liquidez, reputación, expansión, operación, cumplimiento, personas) y mantiene el registro contra esa vara"
  objeto_primario: O1
  objetos_secundarios: [O2, T3]
  nivel_primario: directorio
  niveles_secundarios: [estrategico]
  principios: [P3, P7]
  combina_con:
    - { m: M16, como: "cl.6.1 risk-based thinking es el gancho MVP (riesgos[] tipados por proceso); 31000 lo eleva a apetito del directorio cuando se activa" }
    - { m: M04, como: "arbitraje: appetite de Shape Up = tiempo/alcance que se apuesta; apetito de riesgo = exposición que el directorio tolera — dos varas distintas de la misma apuesta" }
    - { m: M15, como: "el semáforo de madurez no reemplaza el apetito: el gap dice dónde duele, el apetito dice cuánto dolor se acepta" }
    - { m: M28, como: "el apetito FILTRA por exposición antes de que el CoD ORDENE por economía" }
    - { m: M54, como: "la mezcla de ambición es el apetito hecho asignación: el % en transformar = riesgo que el directorio acepta explícito" }
    - { m: M56, como: "el piso de caja es apetito de liquidez hecho número — misma mecánica de vara, expresada en dinero y con fecha" }
    - { m: M58, como: "el registro y su contraste contra el apetito son entrada de la sesión; el riesgo que excede la vara sale como acuerdo con responsable y plazo" }
  donde: { modulos: [m1, m2], etapas: [], capa_contexto: true }
  modo: columna
  twin:
    rol_ancla: ancla
    proyecciones: []
    dimensiones: [riesgo-controles, estrategia]
    cuando_si: "el directorio define apetito por categoría con umbral y mantiene el registro (riesgo · probabilidad · impacto · responsable · mitigación · tendencia), cada uno anclado al proceso, área o brecha que lo produce; nivel y veredicto contra el apetito se DERIVAN al leer, con evidencia+conf. Todo riesgo por encima de su vara sale de la sesión como acuerdo con responsable y plazo (M58) — el registro que no produce trabajo es un anexo"
    cuando_no: "sin aparato ERM completo ni certificación (misma línea que VISION §ISO); apetito sin definir se MUESTRA como 'sin definir' — jamás se inventa (anti-alucinación M23); riesgo sin responsable ni mitigación es una preocupación, no un riesgo gestionado; jamás riesgo asignado a una persona nombrada (responde el ROL — CK-24)"
    # v19 (2026-07-29) · PROMOCIÓN `horizonte → ancla`, con `modo: situacional → columna`.
    # Razón: la carta decía "gateada por demanda / cl.6.1 de M16 basta en el MVP" mientras el nivel 1
    # del twin YA materializa apetito + registro como superficie de primera clase (D-24, 6 riesgos con
    # veredicto derivado contra la vara de su categoría). Una carta que contradice al producto vigente
    # no es un horizonte: es drift. La tensión estaba declarada dentro de la propia carta desde v18.1.
    # Lo que NO cambia: sigue sin aparato ERM y sin certificación — se adopta la vara, no la burocracia.

