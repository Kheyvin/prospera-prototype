# ── M46 · doctrina del arnés (CK-30, 2026-07-25) ──
M46:
  nombre: "Arnés por rol×proceso — el trabajo compilado del twin"
  nombre_corto: "Arnés por rol×proceso"
  familia: I
  fuente: { autor: "propia (Cockpit, CK-30) · marcos: Agent Skills (estándar abierto, Anthropic) · CSA Agentic AI Autonomy Levels L0-L5 · Elish (moral crumple zones) · Green (flaws of human oversight)", obra: "El arnés como vista COMPILADA del twin — unidad rol×proceso, ensamblaje por puesto, corrida por persona; autonomía derivada del riesgo y supervisión especificada y medida", url: "https://agentskills.io/specification" }
  que: "el paquete ejecutable (skills · subagentes · hooks · permisos · sandbox) que opera UN rol dentro de UN proceso, GENERADO del twin y jamás editado a mano. Tres unidades distintas: se COMPILA por rol×proceso (1 plugin; sus skills = los procedimientos de ese rol) · se ENSAMBLA por puesto (roster de N arneses con versión y canal — el puesto ejecuta N roles) · se INSTALA y CORRE por persona (su runtime, su licencia, su telemetría). Lleva su rebanada del hilo de oro (a qué KPI apunta), sus guardrails (por dónde no ir, con MECANISMO declarado) y punteros al conocimiento (dónde buscar)"
  aporte_unico: "el ANCLAJE `deriva_de{puesto, rol, proceso}` + `hash_fuente` con gate anti-drift: el arnés no puede divergir del modelo porque el gate rechaza el commit. Ningún registro de agentes del mercado (Workday ASOR · SAP LeanIX AI Agent Hub · CSA Agent Registry v1) apunta al elemento organizacional que justifica al agente — todos tienen dueño humano, ninguno tiene procedencia. Y la SUPERVISIÓN se especifica y se mide (qué verificar · con qué evidencia · en cuánto tiempo), no se declara: supervisión declarada = zona de deformación moral (Elish/Green)"
  cuando_usar: "al compilar, versionar o auditar el trabajo de un puesto; al decidir la granularidad de un skill (actividad hoy, tarea con id); al fijar autonomía y puertas de aprobación de un agente que opera en nombre de un trabajador"
  objeto_primario: O4
  objetos_secundarios: [O3, O7, T3]
  nivel_primario: operativo
  niveles_secundarios: [tactico]
  principios: [P7, P5, P4]
  combina_con:
    - { m: M25, como: "la A del RACI define quién supervisa y qué gates humanos existen dentro del arnés; C/I = contexto de lectura, NO generan skills" }
    - { m: M36, como: "el veredicto del triage es el CANDIDATO a skill: automatizable-* / aumentable entran al arnés, humano-por-diseño se queda como gate del supervisor" }
    - { m: M37, como: "el verbo canónico es la unidad narrativa que se compila a procedimiento; su clase ALM×MGI informa la autonomía sugerida" }
    - { m: M40, como: "la frontera CK-24 cae entre ENSAMBLAR (por puesto, dato del twin) y CORRER (por persona): la telemetría de uso se agrega por rol antes de volver al twin" }
    - { m: M32, como: "el arnés entra al metamodelo como entidad REGISTRO (procedencia + versión + drift), no como contenido — el contenido lo compila la fábrica" }
    - { m: M38, como: "la instrucción de trabajo (ISO 10013 n3) es la fuente humana del mismo procedimiento que el skill ejecuta: un origen, dos salidas" }
  donde: { modulos: [m2, m3], etapas: [], capa_contexto: true }
  modo: columna
  twin:
    rol_ancla: ancla
    proyecciones: [arnes-compilado, roster-por-puesto]
    dimensiones: [trabajo-compilado, organizacion, triage-automatizacion]
    cuando_si: "el twin declara el REGISTRO del arnés (deriva_de · version · hash_fuente · estado/drift · autonomia L0-L5 derivada del riesgo del puesto · supervisor · verificacion_humana · indicadores) y la fábrica compila el CONTENIDO; guardrail sin mecanismo (hook/permiso/sandbox) NO es guardrail — la regla la hace cumplir el runtime, no el prompt"
    cuando_no: "el arnés NO se edita a mano (se recompila) · NO se compila por persona (dos ocupantes del mismo puesto reciben lo mismo) · NO arranca sobre L2 sin ratificación (la evidencia dice que los agentes multi-paso fallan: 30% TheAgentCompany, caída pass^1→pass^8) · identidad por impersonación PROHIBIDA (el agente tiene identidad propia y actúa en nombre de la persona)"

# ── M47-M50 · modelos de madurez y benchmark (ingesta /metodo-aprende 2026-07-27) ──
# Origen: barrido de madurez sobre las 46 cards — una sola escalera (COBIT 0-5, M15) para todo
# el catálogo; huecos en T3 (loop binario), O3 (proceso sin desempeño comparado), O4, O7, T2.
# Doctrina de entrada: nivel/rango SIEMPRE derivado de evidencia con provenance (M23), jamás
# pintado a mano (M31) ni atribuido a persona nombrada (M40/CK-24). CMMI evaluado y NO ingresado:
# su ADN ya está en los niveles COBIT (ISACA alineó ambos); su aparato de appraisal contradice
# VISION §ISO (sin certificación).

M47:
  nombre: "ISO 9004:2018 — madurez del sistema de gestión (autoevaluación)"
  nombre_corto: "ISO 9004 (madurez)"
  familia: D
  fuente: { autor: "ISO/TC 176", obra: "ISO 9004:2018 — Quality of an organization: guidance to achieve sustained success (Anexo A: autoevaluación de madurez 1-5)", url: "https://www.iso.org/standard/70397.html" }
  que: "autoevaluación de madurez 1-5 por elemento del sistema de gestión (contexto, liderazgo, estrategia, recursos incl. finanzas y personas, procesos, mejora) — guía NO certificable, mismo HLS que ISO 9001"
  aporte_unico: "la ESCALERA de madurez organizacional cross-función que 9001 no trae (conformidad binaria → grados 1-5): gradúa el PDCA, los roles, la documentación y las funciones de negocio (finanzas incluida), no solo IT"
  cuando_usar: "diagnóstico M1 y mantenimiento M2 — nivel actual vs deseado por dimensión del sistema de gestión que M16 releva; descriptores por nivel para capacidades no-IT del heatmap"
  objeto_primario: O6
  objetos_secundarios: [T3, O4]
  nivel_primario: estrategico
  niveles_secundarios: [directorio, tactico]
  principios: [P3, P4]
  combina_con:
    - { m: M16, como: "hermana HLS: 9001 releva el QMS (conformidad), 9004 lo GRADÚA (madurez 1-5) — sin aparato de certificación, alineado a VISION §ISO" }
    - { m: M15, como: "arbitraje de escaleras: COBIT 0-5 manda en gobierno/IT y como semáforo del heatmap; 9004 1-5 manda en sistema de gestión y funciones de negocio" }
    - { m: M31, como: "presta descriptores por nivel a capacidades no-IT del heatmap — el nivel sigue siendo DERIVADO de evidencia, jamás pintado a mano" }
    - { m: M38, como: "gradúa cobertura/vigencia del corpus documental (pirámide 10013) — madurez de la información documentada" }
    - { m: M40, como: "la madurez de 'personas' se agrega por rol/área — jamás evaluación de persona nombrada (CK-24)" }
    - { m: M60, como: "arbitraje de la vara, ampliado a Brasil: 9004 es el DEFAULT; si el cliente brasileño ya se mide con MEG/FNQ, entra su puntaje como evidencia y NO se corre 9004 en paralelo (una escalera por dimensión — D-32)" }
  donde: { modulos: [m1, m2], etapas: [], capa_contexto: true }
  modo: columna
  twin:
    rol_ancla: ancla
    proyecciones: []
    dimensiones: [madurez-brecha, calidad-loop, organizacion]
    cuando_si: "nivel 1-5 por dimensión del sistema de gestión con evidencia+conf (M23); autoevaluación asistida por el consultor; actual vs deseado alimenta brechas del twin. **El número viaja SIEMPRE con su escala declarada** (D-32: `iso9004-1-5` ≠ `cobit-0-5`) y con las referencias del twin en que se apoya (`evidencia_refs`); la autoevaluación es un acto de gobierno con fecha y sesión (`evaluado_en_ref` — D-33), no un campo que envejece"
    cuando_no: "NO se busca sello (es guía, no certificable — coherente con VISION §ISO); jamás nivel por persona nombrada; el nivel no se declara — se deriva de evidencia con provenance. **Sin `evidencia_refs` el nivel es una OPINIÓN**: se muestra con `conf` baja y se dice, jamás se presenta como medición (D-33). Una dimensión con `deseado == actual` no significa 'sin brecha': significa que nadie fijó a dónde quiere llegar — y eso se declara igual"

