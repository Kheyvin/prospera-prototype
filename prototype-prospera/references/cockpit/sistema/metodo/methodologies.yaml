# ====================== F · Valor, Costo & Alineación ======================

M21:
  nombre: "OKR (Objectives & Key Results)"
  familia: F
  fuente: { autor: "John Doerr; Christina Wodtke", obra: "Measure What Matters / Radical Focus", url: "https://www.whatmatters.com/" }
  que: "objetivo cualitativo + key results medibles por trimestre"
  aporte_unico: "el KR TRIMESTRAL — el indicador a mover, target de etapa 0 y destino del roll-up"
  cuando_usar: "encuadre (paso 1) + Hilo de Oro"
  objeto_primario: O2
  objetos_secundarios: []
  nivel_primario: estrategico
  niveles_secundarios: [directorio, tactico]
  principios: [P1, P2]
  combina_con:
    - { m: M15, como: "el KR baja del goals cascade" }
    - { m: M22, como: "el roll-up sube el aporte real al KR" }
    - { m: M06, como: "impact conecta KR ↔ deliverable" }
    - { m: M54, como: "el KR declara `ambicion` (operar|expandir|transformar) — colorea la cascada sin ceremonia nueva" }
  donde: { modulos: [m1, m2, m3], etapas: [], capa_contexto: true }
  modo: columna
  twin:
    rol_ancla: ancla
    proyecciones: []
    dimensiones: [estrategia]
    cuando_si: "el MOTOR de 90 días — eslabón KR de la cascada canónica (plan 3a → plan anual → objetivo → KR → KPI → actividad). **El KR cuelga de una SERIE** (`kr.kpi_ref`): es un contrato de cambio sobre un indicador que ya se mide — misma serie, distinto contrato. Su valor actual se LEE de la última medición, jamás se teclea al lado (D-34); y responde un ROL (`accountable_ref`), nunca una persona"
    cuando_no: "alignment + catchball, NO cascada estricta (objetivos.md §8); sin OKR individual — la persona entra como ocupante del rol. **KR sin serie = meta declarada, no medida**: se muestra así, no se disfraza de medición. Los `peso` de los KPI que contribuyen a un mismo KR **suman 1**; si no, o falta un indicador o el peso está sin normalizar — las dos se declaran, ninguna se completa sola (D-36). El sentido del semáforo lo lleva el dato (`kpi.direccion`), jamás se infiere del orden de la banda (D-31)"

M22:
  nombre: "FinOps — Quantify Business Value"
  familia: F
  fuente: { autor: "FinOps Foundation", obra: "Quantify Business Value", url: "https://www.finops.org/framework/domains/quantify-business-value/" }
  que: "empareja gasto tecnológico con valor de negocio; unit economics; atribución. Y el otro lado de la misma moneda: la REALIZACIÓN — lo prometido se sigue hasta lo efectivamente cobrado, con fecha y con verificador"
  aporte_unico: "el UNIT ECONOMICS — costo real + ahorro contrafactual (vs devs) + aporte por capability. Corolario cardinal (twin v18): toda promesa de valor lleva su contraparte COBRADA — una apuesta o un proyecto que declara beneficio y nunca lo rinde es exactamente el 'indicador sin ancla de valor' cometido en el nivel más alto. Lo cobrado lo escribe la fuente contable y lo verifica finanzas, JAMÁS quien prometió"
  cuando_usar: "loop de valor (aceptación, paso 11) y cada sesión de revisión: prometido vs cobrado por apuesta y por proyecto cerrado"
  objeto_primario: O2
  objetos_secundarios: [T3]
  nivel_primario: directorio
  niveles_secundarios: [estrategico, tactico]
  principios: [P1, P2]
  combina_con:
    - { m: M21, como: "el aporte sube al KR" }
    - { m: M06, como: "atribución por capability" }
    - { m: M48, como: "el unit economics interno gana su vara externa: ¿mi costo/desempeño es bueno vs pares?" }
    - { m: M04, como: "la apuesta declara el valor que persigue Y lo que lleva cobrado a la fecha: el ciclo por-sellar→sellada→cumplida sólo cierra en 'cumplida' con valor cobrado verificado" }
    - { m: M55, como: "el valor cobrado se escribe contra la fuente contable (cierre del periodo), no contra una planilla del área que prometió" }
    - { m: M42, como: "la auditoría de beneficios ~12 meses del proyecto formal es esta misma disciplina un nivel abajo — doble firma sponsor + finanzas" }
  donde: { modulos: [m2, m3], etapas: [], capa_contexto: true }
  modo: columna
  twin:
    rol_ancla: ancla
    proyecciones: []
    dimensiones: [madurez-brecha, estrategia]
    cuando_si: "cuantificar costo/ROI de cada brecha (unit economics del ciclo brecha→proyecto→KPI movido) Y registrar lo cobrado: valor prometido, valor cobrado a la fecha, quién lo verificó y con qué fuente"
    cuando_no: "no es contabilidad cloud completa — solo el valor/ahorro que prioriza brechas y su realización. Valor cobrado SIN verificador declarado no se pinta como cobrado; apuesta no sellada NO cobra nada (se dice, no se rellena con cero engañoso)"

M26:
  nombre: "Hoshin Kanri (Strategy Deployment)"
  familia: F
  fuente: { autor: "Yoji Akao (orígenes) · práctica Lean/Toyota", obra: "Hoshin Kanri — Policy Deployment (X-matrix · catchball)", url: "https://blog.i-nexus.com/hoshin-kanri-x-matrix-explained" }
  que: "traduce la visión a 3-5 años → breakthrough anual → prioridades → métricas, en cascada por niveles con catchball (ida y vuelta)"
  aporte_unico: "la CASCADA estrategia→toda-la-org — baja las metas del directorio hasta el último peldaño, con acuerdo bidireccional (catchball)"
  cuando_usar: "etapa 1 — alinear el TO-BE a los objetivos del directorio; plan a 3 años → slice anual → OKR trimestral"
  objeto_primario: O2
  objetos_secundarios: [O4, T3]
  nivel_primario: directorio
  niveles_secundarios: [estrategico, tactico]
  principios: [P1, P2]
  combina_con:
    - { m: M21, como: "Hoshin da la dirección multi-año; OKR ejecuta el trimestre dentro de ella" }
