    - { m: M48, como: "el ID PCF es la clave de join del benchmark externo — la taxonomía abre la comparación sin metamodelo nuevo" }
    - { m: M16, como: "ARBITRAJE de la dimensión que las dos anclan (D-a · 2026-07-30): no compiten porque clasifican para cosas distintas — APQC clasifica para COMPARAR (id universal = clave de join del benchmark), el mapa de procesos de M16 clasifica para LEER (dirección · negocio · apoyo). El tipo NO se deriva del id APQC: la categoría 1.0 ('desarrollar visión y estrategia') es operating en APQC y dirección pura en el mapa ISO — la inferencia se rompe en la primera fila. Se declaran las dos" }
  donde: { modulos: [m1, m2], etapas: [], capa_contexto: true }
  modo: columna
  twin:
    rol_ancla: ancla
    proyecciones: []
    dimensiones: [procesos-clasificacion]
    cuando_si: "ancla de CLASIFICACIÓN COMPARABLE: cada proceso hallado recibe su id de la taxonomía universal (esqueleto anti-pérdida + cobertura + la clave con que M48 trae la vara externa)"
    cuando_no: "clasifica, no narra — el flujo es de BPMN-lite (M11) y el detalle de actividades de la taxonomía de verbos (M37). Y clasifica para COMPARAR, no dicta la geografía: el tipo del mapa (dirección · negocio · apoyo) es dato declarado de M16, jamás derivado del id APQC (D-a)"

