# ── M54 · portafolio de ambición (ingesta /metodo-aprende, ratificada operador 2026-07-27) ──

M54:
  nombre: "Portafolio de ambición 70/20/10 (matriz de ambición de innovación)"
  nombre_corto: "Ambición 70/20/10"
  familia: F
  fuente: { autor: "Bansi Nagji & Geoff Tuff (Monitor/Deloitte); antecedentes: Baghai/Coley/White Tres Horizontes 1999 · March explore/exploit 1991 · Google (Schmidt) 2005; corrección: Blank 2019", obra: "Managing Your Innovation Portfolio (HBR, mayo 2012) — Innovation Ambition Matrix", url: "https://hbr.org/2012/05/managing-your-innovation-portfolio" }
  que: "clasifica TODO esfuerzo (idea · proyecto_mejora · KR) en tres bolsas por NOVEDAD (mercado × oferta), jamás por plazo (Blank 2019): operar el hoy (core, ~70) · expandir a lo vecino (adyacente, ~20) · apostar al futuro (transformacional, ~10); mezcla real vs mezcla objetivo, visible por rol/área/unidad/empresa"
  aporte_unico: "el COLOR del esfuerzo — campo `ambicion` transversal que el twin agrega al leer (rollup vs `mezcla_objetivo` de config_estrategia). El ratio NO es dogma: HBR lo midió por industria (industrial ≈70/20/10 · consumo masivo ≈80/18/2 · tech media ≈45/40/15) y el retorno es INVERSO (≈10/20/70 — el 10 transformacional genera ~70% del valor nuevo); ajustar por industria/etapa/posición competitiva"
  cuando_usar: "al crear/triageár idea, proyecto_mejora o KR (m1: clasificar el portafolio hallado en el diagnóstico · m2/m3: mantener la mezcla visible y balanceada)"
  objeto_primario: O2
  objetos_secundarios: [O7, O1]
  nivel_primario: directorio
  niveles_secundarios: [estrategico, tactico]
  principios: [P1, P2]
  combina_con:
    - { m: M21, como: "cada KR declara su ambición — la cascada canónica se colorea sin ceremonia nueva" }
    - { m: M26, como: "el plan 3a→anual fija la mezcla_objetivo; el catchball la negocia por nivel" }
    - { m: M28, como: "WSJF prioriza DENTRO de cada bolsa, jamás entre bolsas (ambidestreza O'Reilly/Tushman: exploit devora a explore si comparten cola)" }
    - { m: M44, como: "cada idea del embudo se etiqueta en el triaje del comité — protege el flujo transformacional de morir contra lo urgente" }
    - { m: M45, como: "es el instrumento concreto del balance de portafolio que ISO 56002 exige en abstracto" }
    - { m: M52, como: "la mezcla ES apetito de riesgo materializado: transformar = riesgo aceptado explícito del directorio" }
    - { m: M57, como: "la mezcla en porcentaje es la intención; el presupuesto por bolsa es la misma decisión con plata y con saldo" }
    - { m: M61, como: "la mezcla reparte ENTRE bolsas; OBZ disciplina lo que pasa DENTRO de la bolsa de operar — donde el gasto heredado se esconde" }
  donde: { modulos: [m1, m2, m3], etapas: [], capa_contexto: true }
  modo: columna
  twin:
    rol_ancla: ancla
    proyecciones: [mezcla-ambicion]
    dimensiones: [estrategia, mejora-proyectos]
    cuando_si: "toda idea/proyecto_mejora/KR lleva `ambicion` (operar|expandir|transformar); el twin computa mezcla real vs mezcla_objetivo al leer (rollup por rol/área/unidad/empresa) — el derivado jamás se persiste"
    cuando_no: "NO cuota rígida por persona (explore se concentra en pocos y se protege — el '20% time' universal murió); NO clasificar por plazo sino por novedad; NO priorizar cross-bolsa con WSJF; el 70/20/10 NO es prescripción universal — default configurable por industria"

# ── M55-M59 · gobierno del directorio (ingesta /metodo-aprende 2026-07-29 · auditoría twin v18) ──
# Hueco detectado: el catálogo cubría la EJECUCIÓN de la estrategia (M04 apuesta · M21/M26/M30/M41
# cascada · M52 apetito · M54 mezcla · M28 prioridad · M22 valor por brecha) — la segunda mitad de la
# agenda de un directorio. Faltaba la primera: el RESULTADO cerrado, la CAJA, el PRESUPUESTO y los
# ACUERDOS; y, del lado del capital, el portafolio de INVERSIONES (distinto del de mejoras).
# Regla que las cinco comparten: el twin NO reemplaza al sistema contable — lo LEE con estado de
# cierre y procedencia, y BAJA cada número al proceso/área que lo produce (esa bajada es el aporte).

M55:
  nombre: "Reporte financiero como fuente — marco contable (NIIF / NIIF para PYMES) leído, jamás reexpresado"
  nombre_corto: "Reporte financiero (fuente)"
  familia: F
  fuente: { autor: "IASB (IFRS Foundation)", obra: "Marco Conceptual + NIIF/IFRS y NIIF para las PYMES — estados financieros, ciclo de cierre y revelaciones", url: "https://www.ifrs.org/issued-standards/list-of-standards/" }
  que: "el marco de reporte que la empresa declara (NIIF plenas o NIIF para PYMES) fija QUÉ significan sus cifras, su ciclo de cierre (preliminar → cerrado → auditado) y qué se revela; el twin consume un puñado de esas cifras como dato con procedencia, con su estado de cierre a la vista"
  aporte_unico: "el PUENTE libro↔operación: cada cifra del reporte se ancla al proceso, área u objetivo que la produce, y las decisiones contables que dependen de la operación (reconocimiento de ingreso · deterioro de cobranza · valorización de lo que está a medio construir · contingencias · arrendamientos · partes relacionadas) quedan navegables al twin. Ningún sistema contable puede hacerlo: no conoce el proceso. Corolario duro: un avance de obra DECLARADO por encima del real infla lo construido en el libro — la brecha operativa ES un hallazgo de reporte"
  cuando_usar: "encuadre del nivel directorio (m1) y cada sesión de revisión (m2): leer el resultado del periodo contra plan y contra el año anterior, con el estado de cierre declarado"
  objeto_primario: O2
  objetos_secundarios: [T1, T3]
  nivel_primario: directorio
  niveles_secundarios: [estrategico]
  principios: [P1, P2]
  combina_con:
    - { m: M22, como: "FinOps cuantifica el valor de UNA brecha o apuesta; el reporte financiero es el marcador consolidado contra el que ese valor se cobra — sin él, el beneficio queda declarado y nunca verificado" }
    - { m: M23, como: "el estado de cierre ES procedencia: una cifra preliminar se muestra preliminar y jamás se pinta como cerrada (misma regla que fuente/conf del AS-IS)" }
    - { m: M16, como: "cl.9.3 revisión por la dirección exige el desempeño del periodo como entrada — este es el dato que la alimenta" }
    - { m: M30, como: "la perspectiva financiera del strategy map deja de ser un rótulo: sus objetivos se contrastan contra el resultado real del periodo" }
    - { m: M59, como: "el valor ganado explica una parte del resultado antes de que el resultado la muestre — y el desvío avance-real vs declarado es el input de la valorización de la obra en curso" }
  donde: { modulos: [m1, m2], etapas: [], capa_contexto: true }
  modo: columna
  twin:
    rol_ancla: intercambio
    proyecciones: []
    dimensiones: [estrategia, provenance]
    cuando_si: "el twin lee cifras del sistema contable (ingresos · margen · gasto · resultado · caja · deuda) con marco declarado, estado de cierre y fuente, y ancla cada una al proceso/área/objetivo que la produce"
    cuando_no: "el twin NO arma el juego completo de estados financieros ni sus notas, NO corre el cierre contable, NO reexpresa cifras cerradas y NO emite opinión de auditoría — enlaza y cita, con el estado de cierre siempre visible. El código de la norma vive dentro de la ficha como procedencia, jamás en pantalla (misma regla que los códigos M-NN)"

M56:
  nombre: "Liquidez del directorio — proyección de caja a 13 semanas y límites del financiamiento"
  nombre_corto: "Liquidez (caja 13 semanas)"
  familia: F
  fuente: { autor: "Práctica de tesorería corporativa y reestructuración (13-week cash flow) · ACT/AFP treasury guidance", obra: "Rolling 13-week cash flow forecast + covenant headroom monitoring", url: "https://www.treasurers.org/hub/treasurer-magazine/13-week-cash-flow-forecasting-basics" }
  que: "la proyección corta y rodante de entradas y salidas (13 semanas), contra un PISO de caja que la gobernanza firma, más los límites que impone quien presta (resguardos financieros / covenants) y la línea disponible"
  aporte_unico: "separa SOLVENCIA de RESULTADO: una empresa con margen puede quedarse sin caja, y el directorio lo ve semanas antes si mira la proyección y no el estado de resultados. El piso de caja es una vara del mismo tipo que el apetito de riesgo (la firma la gobernanza, no la gerencia), y romper un resguardo puede obligar a pagar la deuda por adelantado — por eso se mira ANTES de aprobar más inversión o más deuda"
  cuando_usar: "encuadre del nivel directorio (m1) y cada sesión (m2); obligatorio cuando el diagnóstico revela tensión de cobranza, obra en curso o deuda con resguardos"
  objeto_primario: O2
