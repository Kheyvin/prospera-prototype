    - { m: M52, como: "arbitraje (recíproca en M52): appetite = tiempo/alcance que se apuesta; apetito de riesgo = exposición que el directorio tolera — dos varas distintas de la misma apuesta" }
    - { m: M54, como: "la apuesta lleva su bolsa de ambición y entra al rollup de mezcla real (D-22/D-23)" }
  donde: { modulos: [m2, m3], etapas: [e0, e3], capa_contexto: false }
