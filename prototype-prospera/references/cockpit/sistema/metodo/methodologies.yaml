  aporte_unico: "el FUTURE-STATE del FLUJO + el desperdicio visible (toque vs espera) — vende el ahorro a nivel de flujo; el veredicto por actividad es del triage ECRS (M35)"
  cuando_usar: "AS-IS de procesos y modelado de future-state (etapa 3)"
  objeto_primario: O3
  objetos_secundarios: [O6]
  nivel_primario: tactico
  niveles_secundarios: [operativo]
  principios: [P3, P1]
  combina_con:
