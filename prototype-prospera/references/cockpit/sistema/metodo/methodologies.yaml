    cuando_no: "NO es un sistema de presupuestación ni reemplaza al ERP; guarda el reparto y su compromiso, no el asiento. Presupuesto sin aprobar se muestra SIN APROBAR — la intención no se pinta como decisión"

M58:
  nombre: "Gobierno de la sesión de directorio — acuerdos, acta y facultades"
  nombre_corto: "Sesión de directorio (acuerdos y acta)"
  familia: D
  fuente: { autor: "ISO (cl.9.3 revisión por la dirección) + práctica de gobierno corporativo (OCDE — Principios de Gobierno Corporativo G20/OCDE 2023)", obra: "ISO 9001:2015 cl.9.3 (entradas/salidas de la revisión) · delegación de facultades y registro de acuerdos del órgano de gobierno", url: "https://www.oecd.org/corporate/principles-corporate-governance/" }
  que: "la sesión como entidad: agenda ordenada, entradas obligatorias (desempeño del periodo, seguimiento de lo acordado, riesgos y cambios), acuerdos con responsable y plazo, acta versionada, y umbrales de facultad que dicen qué decisión sube al directorio y cuál queda en la gerencia"
  aporte_unico: "el punto que abre TODA sesión — qué se acordó la vez pasada y quién respondió — como dato, no como recuerdo; y el mecanismo que hace que la bandeja de decisiones no se vacíe nunca: el UMBRAL POR MONTO O MATERIA. Sin él, un tablero de directorio termina pidiendo decisiones sobre su propia configuración. Un acuerdo sin responsable y sin plazo no es un acuerdo: es una conversación"
  cuando_usar: "encuadre del nivel directorio (m1) y cada sesión de revisión (m2); al cerrar la sesión, para generar el acta"
  objeto_primario: T3
  objetos_secundarios: [O4, O2]
  nivel_primario: directorio
  niveles_secundarios: [estrategico]
  principios: [P7, P4]
  combina_con:
    - { m: M16, como: "cl.9.3: la revisión por la dirección ya exige entradas (desempeño, seguimiento de acciones previas, riesgos) y salidas (decisiones y acciones) — esta card las materializa como entidades y agrega lo que 9001 no cubre: facultades y acta de gobierno" }
    - { m: M25, como: "el acuerdo lleva responsable declarado; la facultad por monto es autoridad declarada — RACI a nivel de gobierno" }
    - { m: M55, como: "el desempeño del periodo es la primera entrada de la sesión" }
    - { m: M52, como: "los riesgos y su contraste contra el apetito son entrada de la sesión y, cuando exceden la vara, salida como acuerdo" }
    - { m: M41, como: "la rendición de cuentas por nivel (GPD) es la misma disciplina un piso abajo: acuerdo con responsable, plazo y verificación" }
    - { m: M61, como: "cada paquete de gasto OBZ necesita un dueño con autoridad real: sale de las facultades por monto, no de una planilla aparte" }
  donde: { modulos: [m1, m2], etapas: [], capa_contexto: true }
  modo: columna
  twin:
    rol_ancla: ancla
    proyecciones: [acta-generada]
    dimensiones: [organizacion, calidad-loop, estrategia]
    cuando_si: "el twin guarda sesión, acuerdos (responsable · plazo · estado) y umbrales de facultad; el acta se GENERA de lo decidido y queda versionada como cualquier otro dato — la sesión siguiente abre con ella"
    cuando_no: "NO es un libro de actas legal ni reemplaza la formalidad societaria de cada país (firmas, legalización, registro); genera el acta de gestión y la traza. Los umbrales son configuración del cliente, jamás valores por defecto inventados"

M59:
  nombre: "Valor ganado (EVM) — el portafolio de inversiones"
  nombre_corto: "Valor ganado (inversiones)"
  familia: F
  fuente: { autor: "PMI · ANSI/EIA-748", obra: "Earned Value Management — valor planificado, valor ganado y costo real; índices de desempeño de costo y cronograma", url: "https://www.pmi.org/learning/library/earned-value-management-systems-analysis-8026" }
  que: "compara el avance REAL de una inversión con lo GASTADO y con lo comprometido, en una sola fila comparable entre inversiones: avance real (no el declarado) · gastado contra presupuesto · ya comprometido contra la meta · fecha de entrega proyectada contra la comprometida · margen proyectado contra plan"
  aporte_unico: "hace visible el sobrecosto ANTES de que aparezca en el resultado, porque compara gasto contra avance FÍSICO y no contra calendario. El desvío entre avance declarado y avance real es el dato de mayor consecuencia del twin: gobierna la entrega, el margen del proyecto y la valorización de lo que está a medio construir en el libro contable. La inversión de capital NO es un proyecto de mejora: se gobierna como portafolio propio"
  cuando_usar: "cliente con inversiones grandes en curso (m1 para levantarlas, m2 para seguirlas en cada sesión)"
  objeto_primario: O2
  objetos_secundarios: [O6, O3]
  nivel_primario: directorio
  niveles_secundarios: [estrategico, tactico]
  principios: [P1, P3]
  combina_con:
    - { m: M55, como: "el desvío avance real vs declarado es el input de cómo se valoriza lo construido en curso — la brecha operativa se vuelve hallazgo de reporte" }
    - { m: M57, como: "cada inversión consume presupuesto: el pedido de más presupuesto sube al directorio por umbral de facultad" }
    - { m: M50, como: "P3M3 gradúa la CAPACIDAD de sostener un portafolio; el valor ganado mide el desempeño de las inversiones concretas de ese portafolio" }
    - { m: M42, como: "distinción cardinal: el proyecto de MEJORA cierra con un indicador movido (DMAIC/PDCA); la INVERSIÓN cierra con un activo entregado y su margen — dos ciclos, dos varas" }
    - { m: M23, como: "avance declarado y avance real se guardan SEPARADOS, cada uno con su fuente: fundirlos borra exactamente el hallazgo" }
  donde: { modulos: [m1, m2], etapas: [], capa_contexto: false }
  modo: situacional
  twin:
    rol_ancla: ancla
    proyecciones: []
    dimensiones: [estrategia, madurez-brecha]
    cuando_si: "el cliente tiene inversiones de capital en curso (obras · planta · locales · contratos plurianuales · líneas de producto) y el twin guarda por cada una avance real y declarado, gasto contra presupuesto, comprometido, entrega y margen proyectado"
    cuando_no: "NO reemplaza el sistema de control de obra ni calcula índices EVM completos (CPI/SPI) en el MVP — guarda las cinco varas comparables y su procedencia. Cliente sin inversiones grandes: la banda no se dibuja (disable honesto), jamás se rellena"

# ====================== Ingesta LATAM/BR 2026-07-29 (CK-33) — el dialecto brasileño que faltaba ======
# El research 00-research-latam-br (historia schema-v2) fijó el veredicto de la CASCADA (GPD = M41).
# Faltaban las dos varas que el corporativo brasileño nombra de verdad y que el catálogo no tenía
# nodo para recibir: la de MADUREZ (MEG/FNQ — el par brasileño de EFQM/9004) y la de CÓMO SE CONSTRUYE
# el presupuesto (OBZ — la cultura de costos 3G/Ambev, que M57 supone ya construido).
# Ambas entran gateadas por demanda (patrón M45/M49/M50): son nodos de acceso, no aparato del MVP.

M60:
  nombre: "MEG / FNQ — Modelo de Excelência da Gestão (la vara brasileña de madurez)"
  nombre_corto: "MEG (FNQ · Brasil)"
  familia: D
  fuente: { autor: "Fundação Nacional da Qualidade (FNQ) · linaje Baldrige", obra: "Modelo de Excelência da Gestão (MEG) — fundamentos + temas + processos/resultados; ciclo de avaliação do PNQ e trilha «Rumo à Excelência»", url: "https://fnq.org.br/modelo-de-excelencia-da-gestao/" }
  que: "modelo de excelencia brasileño: fundamentos de gestión evaluados por ciclo con puntaje (procesos gerenciales + resultados), con trayectoria de niveles hacia el premio nacional (PNQ)"
  aporte_unico: "el MODO BRASILEÑO de la vara de madurez — gemelo exacto de lo que M41 es para M26: misma pregunta que 9004/EFQM, distinto vocabulario y distinto aparato de reconocimiento. Es el nombre que un directorio brasileño reconoce y contra el que ya se autoevaluó; sin este nodo el consultor traduce a un marco que el cliente no usa y pierde la evidencia que el cliente YA tiene"
  cuando_usar: "gateado por demanda: cliente brasileño con historia FNQ/PNQ o con autoevaluación MEG previa — se LEE su ciclo como evidencia del diagnóstico, no se corre un ciclo nuevo"
  objeto_primario: O6
  objetos_secundarios: [T3, O4]
  nivel_primario: estrategico
  niveles_secundarios: [directorio, tactico]
  principios: [P3, P4]
  combina_con:
    - { m: M47, como: "arbitraje de la vara de madurez, ampliado: 9004 es el DEFAULT (familia ISO, sin premio) · MEG cuando el cliente brasileño ya se mide con MEG — entonces su puntaje entra como evidencia (M23) y 9004 no se corre en paralelo. Jamás dos escaleras sobre la misma dimensión: el número viaja con su escala declarada (D-32)" }
    - { m: M49, como: "primos de linaje (ambos con aparato de premio y peso en resultados): EFQM cuando el cliente pide RADAR/reconocimiento europeo · MEG cuando el cliente es brasileño. No se acumulan — se elige el que el cliente ya habla" }
    - { m: M41, como: "el par natural: el cliente Falconi/GPD es el mismo que suele tener historia FNQ — la cascada anual (M41) y la vara de madurez (MEG) son las dos mitades del dialecto brasileño de gestión" }
    - { m: M23, como: "el puntaje MEG del cliente es dato AS-IS con fuente y vigencia (qué ciclo, qué año): un puntaje de hace cuatro años se muestra con su fecha, jamás como el estado de hoy" }
    - { m: M16, como: "los fundamentos MEG cubren el mismo terreno que el QMS releva; el mapeo se declara donde exista, no se inventa equivalencia criterio por criterio" }
  donde: { modulos: [m1], etapas: [], capa_contexto: false }
  modo: situacional
  twin:
    rol_ancla: horizonte
    proyecciones: []
    dimensiones: [madurez-brecha]
    cuando_si: "cliente brasileño que YA tiene autoevaluación o ciclo MEG/PNQ: el twin guarda ese puntaje por fundamento como evidencia de madurez, con escala y ciclo declarados, y lo usa para dimensionar la brecha"
    cuando_no: "NO es el default de madurez (ese rol es de M47) y NO se corre un ciclo MEG desde el twin: el aparato de banca examinadora / assessor externo / candidatura al premio queda fuera del MVP. Sin ciclo declarado no hay puntaje: se muestra 'sin evaluación', jamás un nivel estimado"

M61:
  nombre: "OBZ — Orçamento Base Zero (presupuesto reconstruido, paquete con dueño)"
  nombre_corto: "OBZ (base cero)"
  familia: F
  fuente: { autor: "Zero-Based Budgeting (Peter Pyhrr, Texas Instruments 1970) · práctica brasileña difundida por AmBev/3G Capital y consultoras de gestión", obra: "Orçamento Base Zero — pacotes de gasto con dono, matriz de gasto y meta de redução reconstruida cada ciclo", url: "https://hbr.org/2017/03/how-3g-capital-uses-zero-based-budgeting" }
  que: "construye el presupuesto desde cero cada ciclo en vez de heredar la base histórica: el gasto se agrupa en paquetes, cada paquete tiene un dueño nombrado que lo justifica línea por línea, y se compara entre pares antes de asignar"
  aporte_unico: "ataca la HERENCIA del presupuesto: lo que M57 guarda como reparto, OBZ dice cómo se ARMÓ — sin base histórica + inflación. Su aporte real no es la planilla sino el DUEÑO del paquete: convierte el gasto en algo que alguien defiende con nombre propio, que es exactamente el hueco por el que un presupuesto heredado nunca se discute"
  cuando_usar: "gateado por demanda: cliente con cultura de costos (brasileño 3G/Falconi, o cualquiera que declare meta de reducción de gasto) o diagnóstico que revela gasto heredado sin dueño; encuadre anual (m1) y su defensa en cada sesión (m2)"
  objeto_primario: O2
  objetos_secundarios: [O7, T3]
  nivel_primario: estrategico
  niveles_secundarios: [directorio, tactico]
  principios: [P1, P2]
  combina_con:
    - { m: M57, como: "división cardinal: M57 guarda el reparto y su compromiso (asignado vs comprometido); OBZ es CÓMO se arma ese reparto — desde cero, por paquete con dueño, en vez de heredarlo. Un solo presupuesto en el twin: OBZ es el método de construcción, no una segunda bolsa" }
    - { m: M54, como: "la mezcla de ambición fija el reparto entre bolsas; OBZ disciplina lo que pasa DENTRO de la bolsa de operar (el 70) — que es donde el gasto heredado se esconde" }
    - { m: M58, como: "cada paquete necesita un dueño con autoridad real: el dueño se lee del RACI y de las facultades por monto, no se declara en una planilla aparte" }
    - { m: M55, como: "la meta de reducción se cierra contra el gasto del reporte financiero, jamás contra la planilla que la prometió" }
    - { m: M25, como: "dueño de paquete = A del RACI sobre ese gasto: si el paquete no tiene dueño nombrado, el twin lo muestra SIN DUEÑO (que es el hallazgo, no un campo vacío)" }
  donde: { modulos: [m1, m2], etapas: [], capa_contexto: false }
  modo: situacional
  twin:
    rol_ancla: ancla
    proyecciones: []
    dimensiones: [estrategia]
    cuando_si: "modo de construcción del presupuesto declarado por el cliente: el twin guarda cada paquete de gasto con su DUEÑO (ref a rol) y su meta de reducción, sobre las mismas bolsas de M57 — no una estructura paralela"
    cuando_no: "NO reemplaza a M57 ni duplica el presupuesto; NO es el default (el presupuesto incremental es lo que la mayoría hace y se guarda igual); el twin NO corre el ejercicio OBZ ni construye la matriz de gasto — guarda el paquete, su dueño y su meta. Paquete sin dueño se muestra sin dueño"
