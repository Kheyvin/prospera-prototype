# gen_cobertura.yaml — política de cobertura + reparto DECLARADO de enums exclusivos (D-A2 · RN-17)
# Consumido por gen_cobertura.py. El reparto es diseño firmado (01-spec § Dudas resueltas 6):
# los valores estructuralmente exclusivos (una empresa tiene UN modo) se cubren a nivel FLOTA,
# cada uno en el shell que lo carga por diseño.

# DOCUMENTAL (la ejecución es vía --dimensiones — fix Audit B): el gate golden per-shell es
#   python3 gen_cobertura.py --shell ~/Proyectos/terranova --dimensiones campos,aristas,provenance
# (single-shell mide también enums cuyo hueco vive por diseño en otros shells → sin filtrar,
# exit 1 perpetuo). La flota corre sin filtro (todo al 100%).
politica:
  terranova: { campos: 100, aristas: 100 }        # golden: 100% campos+aristas él solo
  flota:     { campos: 100, aristas: 100, enums: 100, verbos: 100 }

reparto_enums:
  modo_estrategia:
    mixto: terranova
    okr-trimestral: alameda
    gpd-anual: vulcano
  tipo_unidad:
    proyecto: terranova
    obra: terranova
    sucursal: alameda
    franquicia: alameda
    planta: vulcano
  metodologia_mejora:
    dmaic: terranova
    pdca: terranova
    kaizen: alameda
    masp: vulcano

provenance:            # RN-19
  min_fuentes: 4
  max_share: 0.70

# Enums NO observables en instancias — excluidos del medidor con razón declarada (hallazgo T-5):
# el manifiesto los lista como "excluidos estructurales", jamás desaparecen en silencio.
enums_excluidos:
  raci_letra: "claves del mapa raci {R,A,C,I} — los VALORES son refs a rol, la letra nunca es escalar"
  nivel_acceso: "capa kinética: vive en acciones: del catálogo del schema, no en instancias de shell"
  tipo_aprobacion: "capa kinética: ídem — la gobierna auth-niveles/gestión de cambios, no el dato AS-IS"
